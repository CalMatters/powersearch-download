[project]
name = "powersearch-download"
version = "0.1.0"
description = "Download campaign contribution data from PowerSearch, published by the California secretrary of state"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["click>=8.3.1", "requests>=2.32.5"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["powersearchdownload"]

[dependency-groups]
dev = ["pytest>=9.1.0", "pytest-watch>=4.2.0"]

[project.scripts]
powersearch-download = "powersearchdownload.cli:cli"
